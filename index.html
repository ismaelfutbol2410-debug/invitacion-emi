<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuestra Boda</title>
  <!-- Fuentes elegantes desde Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #f4f1ea;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .card {
      background: #ffffff;
      max-width: 480px;
      width: 100%;
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      color: #4a5d4e;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .divider {
      height: 1px;
      background-color: #e0dcd3;
      margin: 25px 0;
    }
    /* Estilos del Recuadro de Pase */
    .pases-box {
      background-color: #f0f4f1;
      border: 1px solid #d1ded3;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .pases-box label {
      font-size: 0.85rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .guest-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: #2c3e30;
      margin-top: 5px;
    }
    /* Formulario */
    .form-group {
      text-align: left;
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 6px;
      color: #444;
    }
    select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.3s;
    }
    select:focus, textarea:focus {
      border-color: #4a5d4e;
    }
    .btn-submit {
      width: 100%;
      background-color: #4a5d4e;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .btn-submit:hover {
      background-color: #38473b;
    }
    #statusMsg {
      margin-top: 15px;
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>¡Nos Casamos!</h1>
    <p class="subtitle">Nuestra Boda</p>
    
    <p style="font-size: 0.95rem; color: #555; line-height: 1.5;">
      Queremos compartir este día tan especial con ustedes. Por favor confirma tu asistencia a continuación.
    </p>

    <div class="divider"></div>

    <!-- TARJETA DE PASE PERSONALIZADO -->
    <div class="pases-box">
      <label>Pase reservado para:</label>
      <div id="nombreInvitado" class="guest-name">Cargando...</div>
    </div>

    <!-- FORMULARIO RSVP -->
    <form id="rsvpForm">
      <div class="form-group">
        <label for="asistencia">¿Confirmas tu asistencia?</label>
        <select id="asistencia" onchange="togglePases(this.value)" required>
          <option value="">Selecciona una opción</option>
          <option value="Confirmado">Sí, ahí estaré / estarémos</option>
          <option value="Declinado">Lo siento, no podré asistir</option>
        </select>
      </div>

      <div class="form-group" id="pasesContainer" style="display: none;">
        <label for="pasesSelect">¿Cuántos pases utilizarás?</label>
        <select id="pasesSelect">
          <!-- Las opciones exactas se generarán solas aquí -->
        </select>
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje para los novios (Opcional):</label>
        <textarea id="mensaje" rows="3" placeholder="Escribe un mensaje bonito..."></textarea>
      </div>

      <button type="button" class="btn-submit" onclick="enviarRSVP()">Enviar Respuesta</button>
    </form>

    <div id="statusMsg"></div>
  </div>

  <script>
    // Tu enlace de Google Apps Script ya configurado correctamente
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-KG7hudHYQ_oG7zGPw1OYFRr13pp26d0SV9d-NcGLWvV3A3dhbbUUlEQQ6_ci4wt9xg/exec";

    // Extrae 'nombre' y 'pases' de la URL del enlace
    const urlParams = new URLSearchParams(window.location.search);
    const nombreInvitado = urlParams.get('nombre') || "Invitado Especial";
    const maxPases = parseInt(urlParams.get('pases')) || 1; 

    // Muestra el nombre del invitado en pantalla
    document.getElementById('nombreInvitado').innerText = nombreInvitado;

    // Genera SOLAMENTE hasta la cantidad exacta de pases permitidos
    const pasesSelect = document.getElementById('pasesSelect');
    for (let i = 1; i <= maxPases; i++) {
      let opt = document.createElement('option');
      opt.value = i;
      opt.innerText = i + (i === 1 ? ' persona' : ' personas');
      pasesSelect.appendChild(opt);
    }

    // Muestra u oculta la selección de número de pases
    function togglePases(val) {
      document.getElementById('pasesContainer').style.display = (val === 'Confirmado') ? 'block' : 'none';
    }

    // Envía la información a tu Google Sheet
    function enviarRSVP() {
      const asistencia = document.getElementById('asistencia').value;
      const statusMsg = document.getElementById('statusMsg');

      if (!asistencia) {
        alert("Por favor selecciona si asistirás.");
        return;
      }

      statusMsg.style.color = "#4a5d4e";
      statusMsg.innerText = "Guardando tu respuesta...";

      const payload = {
        invitado: nombreInvitado,
        asistencia: asistencia,
        pasesConfirmados: asistencia === 'Confirmado' ? document.getElementById('pasesSelect').value : 0,
        mensaje: document.getElementById('mensaje').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMsg.style.color = "green";
        statusMsg.innerText = "¡Muchas gracias! Tu confirmación ha sido guardada.";
        document.getElementById('rsvpForm').reset();
        document.getElementById('pasesContainer').style.display = 'none';
      })
      .catch(error => {
        statusMsg.style.color = "red";
        statusMsg.innerText = "Hubo un error al enviar. Inténtalo de nuevo.";
        console.error(error);
      });
    }
  </script>
</body>
</html>
